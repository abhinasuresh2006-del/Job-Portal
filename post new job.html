<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobPortal — Post New Job</title>
</head>

<style>
       body{
            margin:0;
            display: flex;
        }


        .top-headingbox {
            height: 60px;
            background-color: white;
            border-radius: 10px;
            box-shadow:  lightgray;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .company-profile {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .company-name {
          font-size: 14px;
          color: #333;
        }

        .profile-icon {
          width: 35px;
          height: 35px;
          background-color: blue;
          color: white;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: bold;
        }


        .sidebar {
            background-color: rgb(5, 5, 65);
            width: 220px;
            height: 650px;
            padding: 25px 20px;
            border-radius: 25px;
        }

        .sidebar h1 {
            color: white;
            font-family: poppins;
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            margin: 20px 0;
            display: block;
            padding: 5px;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background-color:gray;
        }

            
        .content {
            padding: 30px;
            font-family: Arial;
            flex:1;
        }

     
        .heading-box {
            background-color: gainsboro;
            padding: 15px 20px;
            border-radius: 15px;
            width: 100%;
            display: flex;
        }

        .heading-box h2 {
            margin: 0;

        }
        
        input,select,textarea{
          width:300px;
          padding:10px;
          box-sizing: border-box;
        }



        .button {
          grid-column: 1 / -1;
          display: flex !important;
          justify-content: flex-end;
          gap: 10px;
          margin-top: 20px;
          width: 100%;
        }

        .button button {
         background-color: blue;
         color: white;
         border: none;
         padding: 10px 20px;
         border-radius: 5px;
         cursor: pointer;
        } 
        .button button:hover{
          background-color: darkblue;
        }

        .required{
          color: red;
        }

        
        .form-fields {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          column-gap: 30px;
          row-gap: 25px;
          width: 100%;
        }

       
       
       
</style>  

<body>

    <aside class="sidebar">

        <h1>Job Portal</h1>

        <a href="#">Dashboard</a>
        <a href="company profile.html">Company Profile</a>
        <a href="job posting.html">Job Postings</a>
        <a href="post new job.html">Post New Job</a>
        <a href="Applicants.html">Applicants</a>
        <a href="logout.html">Logout</a>
        

    </aside>

    <div class="content">


      <div class="top-headingbox">

        <div class="company-profile">

         <div class="company-name">
            ABC Technologies
         </div>

        <div class="profile-icon">
            AT
        </div>

      </div>

    </div>
      
    <form id="jobForm">     
      <div class="heading-box">

            <h2>post new job</h2>

      </div>  
        
        <br><br>

      <div class="form-fields">

           <div>
              <label>Job Title<span class="required">*</span></label>
              <input type="text" id="jobTitle" placeholder="Enter job title" required>
           </div>

          
            <div>
              <label>Job Type<span class="required">*</span></label>

                 <select id="jobType" required>
                    <option value="">select job type</option>
                    <option>Full-time</option>
                    <option>Part-time</option>
                    <option>Internship</option>
                    <option>Hybrid</option>
                    <option>Contract</option>
                  </select>
                  
            </div>
 
            <div>
              <label>Experience(in years)<span class="required">*</span></label>

                 <select id="Experience" required>
                    <option value="">select experience </option>
                    <option>Fresher</option>
                    <option>1-2 years</option>
                    <option>3-5 years</option>
                    <option>5+ years</option>
                  </select>
                  
            </div>
            
            <div>
              <label>Location</label>
              <input type="text" id="location" placeholder="Enter your location">
            </div>

            <div>
              <label>Salary <span class="required">*</span></label>
              <input type="number" id="salary" placeholder="salary" required>
            </div>

            <div>
              <label>Posted on</label>
              <input type="text" id="postedon">
            </div>

          
            <div>
              <label>Status</label>
              <select id="status">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>


            <div>
              <label>Job Description</label>
              <textarea id="job description"></textarea>
            </div>

            <div class="button">
              <button type="reset">Reset </button>
              <button type="submit">Post Job</button>
            </div>
            <p id="message"></p>
        </div>
    </div>  
    </form>    
</main>

<script>

document.getElementById("jobForm").onsubmit = function(event) {

    event.preventDefault();

    var job = {
        title: document.getElementById("jobTitle").value,
        type: document.getElementById("jobType").value,
        experience: document.getElementById("Experience").value,
        location: document.getElementById("location").value,
        salary: document.getElementById("salary").value,
        postedOn: new Date().toLocaleDateString(),
        applications: 0,
        status: document.getElementById("status").value,
        description: document.getElementById("job description").value
    };

    localStorage.setItem("jobData", JSON.stringify(job));

    alert("Job posted successfully");

    window.location.href = "job posting.html";

};

</script>
</body>
</html>
